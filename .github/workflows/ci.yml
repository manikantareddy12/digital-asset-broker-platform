name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ======================
  # Smart Contract Tests
  # ======================
  contracts:
    name: Smart Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Compile contracts
        run: npx hardhat compile
      
      - name: Run tests
        run: npx hardhat test
      
      - name: Run coverage
        run: npx hardhat coverage
        continue-on-error: true

  # ======================
  # Blockchain Gateway Tests
  # ======================
  gateway:
    name: Blockchain Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./blockchain-gateway
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: blockchain-gateway/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint || true
      
      - name: Run tests
        run: npm test || true

  # ======================
  # Spring Boot Backend Tests
  # ======================
  backend:
    name: Loan Service (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./loan-service
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: loanplatform_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d loanplatform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: mvn -B clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/loanplatform_test
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: loan-service/target/surefire-reports/

  # ======================
  # Admin UI Build
  # ======================
  frontend:
    name: Admin UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-ui
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: admin-ui/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npx tsc --noEmit
      
      - name: Build
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-dist
          path: admin-ui/dist/

  # ======================
  # Docker Build Test
  # ======================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [contracts, gateway, backend, frontend]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./blockchain-gateway
          push: false
          tags: loan-platform/gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Loan Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./loan-service
          push: false
          tags: loan-platform/loan-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Admin UI Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-ui
          push: false
          tags: loan-platform/admin-ui:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
